name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # shortcut: npm ci rejects a macOS-made lockfile over rolldown's optional wasm binding deps; return to npm ci when npm fixes it
      - run: npm install --no-audit --no-fund
      - run: npm run check:data
      - run: npm run compile
      - run: npm test
      - run: npm run zip && npm run zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: spaceport-builds
          path: .output/*.zip
